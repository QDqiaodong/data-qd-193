[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-193"
version = "0.4.0"
description = "二维骨架姿态与蒙皮"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rig-pose = "rig_pose.cli:main"
rig-pose-spool = "rig_pose.spool:main"
rig-pose-crop = "rig_pose.crop:main"
rig-pose-worldlock = "rig_pose.worldlock:main"

[tool.setuptools.packages.find]
where = ["src"]
